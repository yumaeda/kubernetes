apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakabas-nextjs
  namespace: sakabas-nextjs
  labels:
    app: sakabas-nextjs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sakabas-nextjs
  template:
    metadata:
      labels:
        app: sakabas-nextjs
    spec:
      serviceAccountName: sakabas-nextjs
      containers:
         - name: sakabas-nextjs
           image: "us-central1-docker.pkg.dev/hello-world-352201/sakabas-nextjs/sakabas-nextjs:latest"
           imagePullPolicy: Always
           ports:
              - name: http
                containerPort: 3000
                protocol: TCP
           env:
              - name: NODE_ENV
                value: "production"
              - name: PORT
                value: "3000"
           resources:
             requests:
               memory: "256Mi"
               cpu: "250m"
             limits:
               memory: "512Mi"
               cpu: "500m"
           securityContext:
             runAsNonRoot: true
             readOnlyRootFilesystem: true
             allowPrivilegeEscalation: false
             capabilities:
                drop:
                 - ALL
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
